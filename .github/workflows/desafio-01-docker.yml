name: "Desafio 01 - Docker Operations"

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: 'Imagem Docker (formato: imagem:tag)'
        required: true
        default: 'alpine:latest'
        type: string

jobs:
  docker-operations:
    name: "Pull e verificação da imagem"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Baixar a imagem Docker"
        run: |
          echo "Baixando a imagem: ${{ inputs.imagem }}"
          docker pull ${{ inputs.imagem }}

      - name: "Listar imagens disponíveis no runner"
        run: |
          echo "Imagens Docker disponíveis no runner:"
          docker images

      # ===== DESAFIO ADICIONAL (Docker Scout) =====
      - name: "Instalar Docker Scout CLI"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh
          echo "$HOME/.docker/scout/bin" >> $GITHUB_PATH

      - name: "Analisar vulnerabilidades com Docker Scout"
        run: |
          echo "Analisando vulnerabilidades da imagem ${{ inputs.imagem }}..."
          docker scout cves ${{ inputs.imagem }} || true